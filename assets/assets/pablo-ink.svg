<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#080808"/>
    <stop offset="45%" stop-color="#1a1a1a"/>
    <stop offset="70%" stop-color="#8b0000"/>
    <stop offset="100%" stop-color="#ff2b2b"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="inkReveal">
    <rect x="-900" y="0" width="900" height="180">

```
  <animate
    attributeName="x"
    values="-900;0;0;-900"
    dur="6s"
    repeatCount="indefinite"
  />

</rect>
```

  </clipPath>

</defs>

<!-- DARK INK BRUSH -->

<g>

<path
d="M-40 112
C70 75 120 125 220 94
C320 62 390 118 490 88
C590 58 690 120 790 84
C850 65 910 82 940 70
L940 145
C820 158 760 130 660 150
C550 170 450 132 350 153
C240 174 140 135 40 158
L-40 150 Z"
fill="url(#ink)"
opacity="0.95"
filter="url(#blur)"

>

```
<animateTransform
  attributeName="transform"
  type="translate"
  values="0 0; 8 -3; 0 0; -5 2; 0 0"
  dur="3s"
  repeatCount="indefinite"
/>
```

  </path>

</g>

<!-- SECOND BRUSH STROKE -->

<path
d="M-30 125
C100 110 160 145 270 112
C390 76 460 137 570 105
C690 72 790 125 930 92
L930 132
C800 160 700 130 590 153
C470 176 370 135 260 160
C160 180 70 150 -30 165 Z"
fill="#050505"
opacity="0.85"

>

<animate
 attributeName="opacity"
 values="0.65;0.9;0.7;0.95;0.65"
 dur="2.5s"
 repeatCount="indefinite"
/>

</path>

<!-- RED INK ACCENT -->

<path
d="M100 143
C200 118 260 151 350 125
C450 96 510 150 610 120
C700 94 780 130 870 105"
fill="none"
stroke="#ff2b2b"
stroke-width="3"
opacity="0.7"
filter="url(#glow)"

>

<animate
 attributeName="stroke-dasharray"
 values="0 1000;500 500;1000 0;0 1000"
 dur="4s"
 repeatCount="indefinite"
/>

</path>

<!-- INK SPLATTERS -->

<g fill="#ff2b2b">

  <circle cx="120" cy="72" r="3">
    <animate
      attributeName="cy"
      values="72;65;72"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="775" cy="65" r="2">
    <animate
      attributeName="cy"
      values="65;72;65"
      dur="2.1s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="830" cy="118" r="3">
    <animate
      attributeName="cy"
      values="118;110;118"
      dur="1.6s"
      repeatCount="indefinite"
    />
  </circle>

  <circle cx="190" cy="145" r="2">
    <animate
      attributeName="cy"
      values="145;151;145"
      dur="2.2s"
      repeatCount="indefinite"
    />
  </circle>

</g>

<!-- NAME -->

