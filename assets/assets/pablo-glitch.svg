<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">

<defs>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff0000"/>
    <stop offset="50%" stop-color="#ff2b2b"/>
    <stop offset="100%" stop-color="#ff0000"/>
  </linearGradient>

  <pattern id="scanlines" width="900" height="6" patternUnits="userSpaceOnUse">
    <rect width="900" height="1" fill="#ffffff" opacity="0.035"/>
  </pattern>

</defs>

<!-- BACKGROUND -->

<rect
width="900"
height="180"
fill="#050505"
/>

<!-- SUBTLE RED ATMOSPHERE -->

<rect
x="120"
y="35"
width="660"
height="110"
fill="#ff0000"
opacity="0.035"
filter="url(#glow)"
/>

<!-- SCANLINES -->

<rect
width="900"
height="180"
fill="url(#scanlines)"
/>

<!-- TOP DIGITAL LINE -->

<rect
x="120"
y="42"
width="660"
height="1"
fill="#ff2b2b"
opacity="0.5"

>

<animate
 attributeName="width"
 values="100;660;400;660"
 dur="2.5s"
 repeatCount="indefinite"
/>

</rect>

<!-- LEFT GLITCH BARS -->

<g fill="#ff2b2b">

  <rect x="95" y="72" width="55" height="3">
    <animate
      attributeName="x"
      values="95;125;80;110;95"
      dur="1.1s"
      repeatCount="indefinite"
    />
  </rect>

  <rect x="145" y="118" width="90" height="2">
    <animate
      attributeName="x"
      values="145;180;125;160;145"
      dur="0.8s"
      repeatCount="indefinite"
    />
  </rect>

  <rect x="70" y="130" width="35" height="2">
    <animate
      attributeName="x"
      values="70;100;60;90;70"
      dur="1.4s"
      repeatCount="indefinite"
    />
  </rect>

</g>

<!-- RIGHT GLITCH BARS -->

<g fill="#ff2b2b">

  <rect x="750" y="68" width="55" height="3">
    <animate
      attributeName="x"
      values="750;720;775;740;750"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

  <rect x="665" y="120" width="90" height="2">
    <animate
      attributeName="x"
      values="665;630;690;650;665"
      dur="0.9s"
      repeatCount="indefinite"
    />
  </rect>

  <rect x="790" y="135" width="35" height="2">
    <animate
      attributeName="x"
      values="790;760;805;775;790"
      dur="1.3s"
      repeatCount="indefinite"
    />
  </rect>

</g>

<!-- RED GLITCH TEXT -->

<text
x="446"
y="108"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="52"
font-weight="700"
letter-spacing="4"
fill="#ff0000"
opacity="0.8"

>

PABLO MARCO

<animate
 attributeName="x"
 values="446;455;442;450;446"
 dur="1.3s"
 repeatCount="indefinite"
/>

</text>

<!-- DARK GLITCH TEXT -->

<text
x="454"
y="108"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="52"
font-weight="700"
letter-spacing="4"
fill="#7a0000"
opacity="0.8"

>

PABLO MARCO

<animate
 attributeName="x"
 values="454;445;458;450;454"
 dur="1.1s"
 repeatCount="indefinite"
/>

</text>

<!-- MAIN NAME -->

<text
x="450"
y="108"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="52"
font-weight="700"
letter-spacing="4"
fill="#ffffff"
filter="url(#glow)"

>

PABLO MARCO

<animate
 attributeName="opacity"
 values="1;1;0.85;1;0.7;1"
 dur="2.2s"
 repeatCount="indefinite"
/>

</text>

<!-- RANDOM GLITCH BLOCK -->

<g fill="#ffffff">

  <rect x="270" y="94" width="20" height="3">
    <animate
      attributeName="opacity"
      values="0;0;1;0;0;1;0"
      dur="1.7s"
      repeatCount="indefinite"
    />
  </rect>

  <rect x="590" y="112" width="30" height="2">
    <animate
      attributeName="opacity"
      values="0;1;0;0;1;0"
      dur="1.4s"
      repeatCount="indefinite"
    />
  </rect>

  <rect x="350" y="125" width="45" height="2">
    <animate
      attributeName="opacity"
      values="0;0;1;0;1;0"
      dur="1.9s"
      repeatCount="indefinite"
    />
  </rect>

</g>

<!-- BOTTOM DIGITAL LINE -->

<rect
x="250"
y="140"
width="400"
height="2"
fill="url(#red)"
filter="url(#glow)"

>

<animate
 attributeName="width"
 values="50;400;250;400"
 dur="2s"
 repeatCount="indefinite"
/>

</rect>

<!-- FRAME -->

<rect
x="25"
y="20"
width="850"
height="140"
fill="none"
stroke="#ff2b2b"
stroke-width="1"
opacity="0.18"
/>

</svg>
