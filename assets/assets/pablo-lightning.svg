<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">

<defs>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="lightning" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff0000"/>
    <stop offset="50%" stop-color="#ff4a2a"/>
    <stop offset="100%" stop-color="#ff0000"/>
  </linearGradient>

</defs>

<!-- RED ATMOSPHERE -->

<rect
width="900"
height="180"
fill="#050505"
/>

<ellipse
cx="450"
cy="95"
rx="350"
ry="70"
fill="#ff0000"
opacity="0.045"
filter="url(#glow)"
/>

<!-- LEFT LIGHTNING -->

<g
fill="none"
stroke="url(#lightning)"
stroke-linecap="round"
stroke-linejoin="round"
filter="url(#glow)"

>

<path
d="M70 130
L125 105
L105 92
L180 62
L150 100
L185 98
L115 145"
stroke-width="3"

>

```
<animate
  attributeName="opacity"
  values="0;0;1;0.2;1;0;0"
  dur="2.4s"
  repeatCount="indefinite"
/>
```

  </path>

<path
d="M170 35
L205 55
L185 68
L225 82"
stroke-width="2"

>

```
<animate
  attributeName="opacity"
  values="0;1;0;0;1;0"
  dur="1.7s"
  repeatCount="indefinite"
/>
```

  </path>

</g>

<!-- RIGHT LIGHTNING -->

<g
fill="none"
stroke="url(#lightning)"
stroke-linecap="round"
stroke-linejoin="round"
filter="url(#glow)"

>

<path
d="M830 130
L775 105
L795 92
L720 62
L750 100
L715 98
L785 145"
stroke-width="3"

>

```
<animate
  attributeName="opacity"
  values="0;1;0.1;0;1;0"
  dur="2.1s"
  repeatCount="indefinite"
/>
```

  </path>

<path
d="M730 35
L695 55
L715 68
L675 82"
stroke-width="2"

>

```
<animate
  attributeName="opacity"
  values="0;0;1;0;0;1;0"
  dur="1.9s"
  repeatCount="indefinite"
/>
```

  </path>

</g>

<!-- TOP LIGHTNING -->

<path
d="M320 28
L350 55
L335 68
L375 82"
fill="none"
stroke="#ff2b2b"
stroke-width="2"
filter="url(#glow)"

>

<animate
 attributeName="opacity"
 values="0;0;1;0;0"
 dur="1.4s"
 repeatCount="indefinite"
/>

</path>

<path
d="M580 28
L550 55
L565 68
L525 82"
fill="none"
stroke="#ff2b2b"
stroke-width="2"
filter="url(#glow)"

>

<animate
 attributeName="opacity"
 values="0;1;0;0;1;0"
 dur="1.8s"
 repeatCount="indefinite"
/>

</path>

<!-- NAME GLOW -->

<text
x="450"
y="108"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="52"
font-weight="700"
letter-spacing="4"
fill="#ff2b2b"
opacity="0.45"
filter="url(#glow)"

>

PABLO MARCO </text>

<!-- NAME -->

<text
x="450"
y="108"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="52"
font-weight="700"
letter-spacing="4"
fill="#ffffff"

>

PABLO MARCO

<animate
 attributeName="opacity"
 values="0;1;1;0.9;1"
 dur="2.5s"
 repeatCount="indefinite"
/>

</text>

<!-- ELECTRIC LINE -->

<path
d="M250 137
L330 137
L350 132
L370 137
L450 137
L530 137
L550 132
L570 137
L650 137"
fill="none"
stroke="#ff2b2b"
stroke-width="1"
opacity="0.5"
filter="url(#glow)"

>

<animate
 attributeName="stroke-dasharray"
 values="0 500;250 250;500 0"
 dur="2.5s"
 repeatCount="indefinite"
/>

</path>

</svg>
