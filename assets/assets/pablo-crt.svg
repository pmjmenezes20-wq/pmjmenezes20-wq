<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">

<defs>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff0000"/>
    <stop offset="50%" stop-color="#ff2b2b"/>
    <stop offset="100%" stop-color="#ff0000"/>
  </linearGradient>

  <pattern id="scanlines" width="900" height="6" patternUnits="userSpaceOnUse">
    <rect width="900" height="2" fill="#ffffff" opacity="0.035"/>
  </pattern>

</defs>

<!-- DARK CRT BACKGROUND -->

<rect width="900" height="180" fill="#050505"/>

<!-- RED CRT GLOW -->

<rect
x="90"
y="45"
width="720"
height="90"
rx="12"
fill="#ff0000"
opacity="0.05"
filter="url(#glow)"
/>

<!-- SCANLINES -->

<rect width="900" height="180" fill="url(#scanlines)"/>

<!-- MOVING SCANLINE -->

<rect
x="0"
y="-10"
width="900"
height="3"
fill="#ff2b2b"
opacity="0.45"
filter="url(#glow)"

>

<animate
 attributeName="y"
 values="-10;190;-10"
 dur="3s"
 repeatCount="indefinite"
/>

</rect>

<!-- STATIC / INTERFERENCE -->

<g fill="#ff2b2b" opacity="0.45">

  <rect x="90" y="62" width="45" height="2">
    <animate
      attributeName="x"
      values="90;110;80;100;90"
      dur="1.2s"
      repeatCount="indefinite"
    />
  </rect>

  <rect x="700" y="110" width="70" height="2">
    <animate
      attributeName="x"
      values="700;680;720;695;700"
      dur="0.9s"
      repeatCount="indefinite"
    />
  </rect>

  <rect x="150" y="125" width="35" height="2">
    <animate
      attributeName="x"
      values="150;170;140;160;150"
      dur="1.5s"
      repeatCount="indefinite"
    />
  </rect>

</g>

<!-- NAME -->

<text
x="450"
y="108"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="52"
font-weight="700"
letter-spacing="4"
fill="#ffffff"
filter="url(#glow)"

>

PABLO MARCO

<animate
 attributeName="opacity"
 values="0;1;1;0.85;1"
 dur="3s"
 repeatCount="indefinite"
/>

</text>

<!-- RED GLITCH LAYER -->

<text
x="450"
y="108"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="52"
font-weight="700"
letter-spacing="4"
fill="none"
stroke="#ff2b2b"
stroke-width="1"
opacity="0.5"

>

PABLO MARCO

<animate
 attributeName="x"
 values="450;454;446;450;450"
 dur="1.7s"
 repeatCount="indefinite"
/>

</text>

<!-- CRT FRAME -->

<rect
x="25"
y="25"
width="850"
height="130"
rx="8"
fill="none"
stroke="#ff2b2b"
stroke-width="1"
opacity="0.25"
/>

</svg>
