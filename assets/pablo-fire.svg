<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#ff0000"/>
    <stop offset="45%" stop-color="#ff2b00"/>
    <stop offset="75%" stop-color="#ff6a00"/>
    <stop offset="100%" stop-color="#ffcc00"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="textGlow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- FIRE / HEAT -->

<g filter="url(#glow)" opacity="0.9">

<path
 d="M80 155
    C65 125 100 112 92 82
    C120 103 130 78 120 55
    C155 82 150 115 170 123
    C160 90 190 68 180 38
    C220 73 205 112 230 126
    C225 94 260 72 252 42
    C300 82 278 120 310 135
    C305 103 340 88 335 55
    C380 93 350 130 390 143
    C430 125 415 90 450 60
    C480 96 460 125 500 140
    C540 125 525 88 560 52
    C595 90 570 125 610 140
    C650 120 635 82 670 45
    C705 84 680 120 720 135
    C760 115 750 78 780 55
    C815 90 790 125 820 145
    C840 120 855 110 850 85
    C885 115 865 140 875 155
    Z"
 fill="url(#fire)"
/>

</g>

<!-- SECOND HEAT LAYER -->

<path
d="M110 158
C100 132 125 118 125 95
C145 118 155 100 152 78
C180 105 170 130 195 140
C190 115 215 98 210 76
C240 105 225 132 250 143
C280 125 270 102 295 82
C320 112 300 137 330 147
C365 130 350 103 375 80
C405 115 380 138 420 150
C450 130 440 103 465 78
C495 112 470 138 510 149
C545 130 530 102 555 78
C585 112 560 138 600 149
C635 130 620 102 645 80
C675 112 650 138 690 148
C720 128 710 105 735 82
C765 112 745 138 775 148
C805 125 800 105 815 90
C835 115 820 137 835 157
Z"
fill="#ff3300"
opacity="0.55"
filter="url(#glow)"

>

<animate
 attributeName="opacity"
 values="0.35;0.7;0.45;0.65;0.35"
 dur="1.8s"
 repeatCount="indefinite"
/>

</path>

<!-- HEAT WAVES -->

<g fill="none" stroke="#ff2b00" stroke-width="2" opacity="0.5">

  <path d="M150 35 C170 20 190 50 210 35">
    <animate
      attributeName="d"
      values="M150 35 C170 20 190 50 210 35;
              M150 30 C170 45 190 15 210 30;
              M150 35 C170 20 190 50 210 35"
      dur="2s"
      repeatCount="indefinite"
    />
  </path>

  <path d="M650 40 C670 25 690 55 710 40">
    <animate
      attributeName="d"
      values="M650 40 C670 25 690 55 710 40;
              M650 35 C670 50 690 20 710 35;
              M650 40 C670 25 690 55 710 40"
      dur="2.3s"
      repeatCount="indefinite"
    />
  </path>

</g>

<!-- NAME -->

<text
x="450"
y="105"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="52"
font-weight="700"
letter-spacing="3"
fill="#ffffff"
filter="url(#textGlow)"

>

PABLO MARCO

<animate
 attributeName="opacity"
 values="0;0;1;1;1"
 dur="2.5s"
 repeatCount="indefinite"
/>

</text>

<!-- RED GLOW -->

<text
x="450"
y="105"
text-anchor="middle"
font-family="JetBrains Mono, monospace"
font-size="52"
font-weight="700"
letter-spacing="3"
fill="none"
stroke="#ff2b00"
stroke-width="1"
opacity="0.45"

>

PABLO MARCO

<animate
 attributeName="opacity"
 values="0.15;0.5;0.2;0.45;0.15"
 dur="2s"
 repeatCount="indefinite"
/>

</text>

</svg>
